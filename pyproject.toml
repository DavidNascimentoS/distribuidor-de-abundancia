[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distribuidor-de-abundancia"
version = "0.1.0"
description = "WhatsApp agent connecting food donors with people in need in Várzea Paulista/Jundiaí (SP, Brazil)."
readme = "README.en.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
